backend:
  image: ghcr.io/workaround-org/presentnow-backend:dev-20
  replicas: 3  # Increased for prod
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
  env:
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://presentnow-postgres-service:5432/presentnow"
    QUARKUS_DATASOURCE_USERNAME: "presentnow"
    QUARKUS_DATASOURCE_PASSWORD: "presentnow"

frontend:
  image: code.mymiggi.de/miggi/presentnow-frontend-v2:dev-6
  replicas: 3  # Increased for prod
  resources:
    limits:
      cpu: "100m"
      memory: "50Mi"

postgres:
  image: postgres:16-alpine
  replicas: 1
  storage: 10Gi  # Increased storage for prod
  storageClass: longhorn
  env:
    POSTGRES_USER: "presentnow"
    POSTGRES_PASSWORD: "presentnow"
    POSTGRES_DB: "presentnow"
    PGDATA: "/var/lib/postgresql/data/pgdata"
  resources:
    limits:
      cpu: "200m"
      memory: "512Mi"

ingress:
  hosts:
    - presentnow.prod.ha1nz.de
    - ideas.ha1nz.de
  tlsSecret: presentnow-prod-tls
  issuer: letsencrypt-prod