apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "present-now.fullname" . }}-postgres
  labels:
    app: {{ include "present-now.fullname" . }}-postgres
spec:
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: {{ include "present-now.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "present-now.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: present-now-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: present-now-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ .Values.postgres.env.POSTGRES_DB | quote }}
            - name: PGDATA
              value: {{ .Values.postgres.env.PGDATA | quote }}
          ports:
            - containerPort: 5432
          {{- if .Values.postgres.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          {{- end }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      {{- if .Values.postgres.persistence.enabled }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: presentnow-postgres-service
spec:
  selector:
    app: {{ include "present-now.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
{{- end }}