apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "present-now.fullname" . }}-gui
  labels:
    app: {{ include "present-now.fullname" . }}-gui
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ include "present-now.fullname" . }}-gui
  template:
    metadata:
      labels:
        app: {{ include "present-now.fullname" . }}-gui
    spec:
      containers:
        - name: gui
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: presentnow-gui-service
spec:
  selector:
    app: {{ include "present-now.fullname" . }}-gui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "present-now.fullname" . }}-ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.issuer | quote }}
spec:
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: presentnow-api-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: presentnow-gui-service
                port:
                  number: 80