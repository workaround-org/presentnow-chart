backend:
  image: ghcr.io/workaround-org/presentnow-backend:latest
  replicas: 1
  resources:
    limits:
      cpu: "100m"
      memory: "100Mi"
  env:
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://unstable-postgres-rw:5432/presentnow"

frontend:
  image: ghcr.io/workaround-org/presentnow-frontend:latest
  replicas: 1
  resources:
    limits:
      cpu: "50m"
      memory: "10Mi"

ingress:
  hosts:
    - presentnow.dev.u-project.de
  tlsSecret: presentnow-tls
  issuer: letsencrypt-prod
