name: Publish Helm Chart (OCI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version override (e.g. 0.2.0). Defaults to Chart.yaml version unless tag-triggered."
        required: false
        type: string
      app_version:
        description: "App version override. Defaults to chart version when version override is used."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  OCI_REGISTRY: ghcr.io
  OCI_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart using real-world values
        run: |
          helm lint . -f values-dev.yaml
          helm lint . -f values-miggi.yaml

      - name: Template chart smoke test
        run: |
          helm template present-now . -f values-dev.yaml > /dev/null
          helm template present-now . -f values-miggi.yaml > /dev/null

      - name: Resolve chart versions
        id: versions
        run: |
          CHART_VERSION_INPUT="${{ inputs.version }}"
          APP_VERSION_INPUT="${{ inputs.app_version }}"

          if [ -n "$CHART_VERSION_INPUT" ]; then
            CHART_VERSION="$CHART_VERSION_INPUT"
            APP_VERSION="${APP_VERSION_INPUT:-$CHART_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${APP_VERSION_INPUT:-$CHART_VERSION}"
          else
            CHART_VERSION=""
            APP_VERSION=""
          fi

          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          if [ -n "${{ steps.versions.outputs.chart_version }}" ]; then
            helm package . \
              --version "${{ steps.versions.outputs.chart_version }}" \
              --app-version "${{ steps.versions.outputs.app_version }}"
          else
            helm package .
          fi

      - name: Authenticate to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login "$OCI_REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to OCI registry
        run: |
          CHART_PACKAGE="$(ls ./*.tgz | head -n 1)"
          helm push "$CHART_PACKAGE" "$OCI_REPOSITORY"
