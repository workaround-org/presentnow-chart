name: Deploy Present Now Chart

on:
  push:
    branches:
      - main
      - action
  workflow_dispatch:

env:
  RELEASE_NAME: present-now
  NAMESPACE: presentnow-dev
  KUBECONFIG_PATH: ${{ runner.temp }}/kubeconfig

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$(dirname "$KUBECONFIG_PATH")"
          printf '%s\n' "$KUBECONFIG_SECRET" > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"

      - name: Deploy chart
        env:
          KUBECONFIG: ${{ env.KUBECONFIG_PATH }}
        run: helm upgrade $RELEASE_NAME . -n $NAMESPACE

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$KUBECONFIG_PATH"
