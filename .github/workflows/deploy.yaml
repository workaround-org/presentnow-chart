name: Deploy Present Now Chart

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RELEASE_NAME: present-now
  NAMESPACE: presentnow-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          ls -lha "$HOME/.kube/config"

      - name: Deploy chart
        env:
          KUBECONFIG: $HOME/.kube/config
        run: helm upgrade $RELEASE_NAME . -n $NAMESPACE
