name: Deploy Helm Chart

on:
  push:
    branches:
      - main
      - action
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Setup kubeconfig
        run: |
          mkdir -p ${{ github.workspace }}/.kube
          # Decode base64 kubeconfig
          echo "$KUBECONFIG_SECRET" | base64 -d > ${{ github.workspace }}/.kube/config
          chmod 600 ${{ github.workspace }}/.kube/config
          # Verify the kubeconfig was decoded properly
          if [ ! -s ${{ github.workspace }}/.kube/config ]; then
            echo "Error: kubeconfig file is empty"
            exit 1
          fi
          echo "Kubeconfig file size: $(wc -c < ${{ github.workspace }}/.kube/config) bytes"
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_SECRET }}

      - name: Verify kubectl connection
        run: |
          export KUBECONFIG=${{ github.workspace }}/.kube/config
          echo "Current KUBECONFIG: $KUBECONFIG"
          kubectl config view
          kubectl config get-contexts
          kubectl cluster-info
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config

      - name: Deploy to presentnow-dev
        run: |
          kubectl config use-context $(kubectl config current-context)
          helm upgrade present-now . -n presentnow-dev --install --wait
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config

      - name: Deploy to presentnow-miggi
        run: |
          kubectl config use-context $(kubectl config current-context)
          helm upgrade present-now . -n presentnow-miggi -f values-miggi.yaml --install --wait
        env:
          KUBECONFIG: ${{ github.workspace }}/.kube/config

      - name: Cleanup kubeconfig
        if: always()
        run: |
          rm -f ${{ github.workspace }}/.kube/config
