backend:
  image: ghcr.io/workaround-org/presentnow-backend:latest
  replicas: 1
  resources:
    limits:
      cpu: "100m"
      memory: "100Mi"
  env:
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://presentnow-postgres-service:5432/presentnow"

frontend:
  image: code.mymiggi.de/miggi/presentnow-frontend-v2
  replicas: 1
  resources:
    limits:
      cpu: "50m"
      memory: "10Mi"

postgres:
  image: postgres:16-alpine
  replicas: 1
  storage: 1Gi
  storageClass: longhorn
  env:
    POSTGRES_DB: "presentnow"
    PGDATA: "/var/lib/postgresql/data/pgdata"
  resources:
    limits:
      cpu: "100m"
      memory: "120Mi"

ingress:
  hosts:
    - presentnow.dev.ha1nz.de
  tlsSecret: presentnow-tls
  issuer: letsencrypt-prod